services:
  - type: web
    name: breathe-esg-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: breathe-esg-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://breathe-esg.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://breathe-esg-backend.onrender.com

  - type: web
    name: breathe-esg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://breathe-esg-backend.onrender.com

databases:
  - name: breathe-esg-db
    databaseName: breathe_esg
    user: breathe_esg_user
    plan: free
